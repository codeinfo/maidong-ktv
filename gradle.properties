android.overridePathCheck=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# 曲库清单地址。首个地址走 GitHub 加速代理（国内直连 raw.githubusercontent.com 基本不可用），
# 分片地址按清单所在目录解析，因此同一份代理前缀会同时加速清单与所有分片。
# 如需改回直连，把下发地址换回 https://raw.githubusercontent.com/codeinfo/maidong-ktv/master/database_publish/database/manifest.json
DATABASE_MANIFEST_URL=https://ghfast.top/https://raw.githubusercontent.com/codeinfo/maidong-ktv/master/database_publish/database/manifest.json
# 备用镜像：jsDelivr 多个节点（国内直连 raw.githubusercontent.com 不可用，已移除以免下载卡在死连接）。
DATABASE_MANIFEST_MIRRORS=https://gcore.jsdelivr.net/gh/codeinfo/maidong-ktv@master/database_publish/database/manifest.json,https://cdn.jsdelivr.net/gh/codeinfo/maidong-ktv@master/database_publish/database/manifest.json,https://fastly.jsdelivr.net/gh/codeinfo/maidong-ktv@master/database_publish/database/manifest.json
# 歌曲媒体源：留空时走内置签名接口取地址（返回的 wb66.cn 链接只支持 TLS1.2+，Android 4.4 握手会失败）。
# 指向可访问的镜像目录（<base>/<filename>）即可绕开该限制，例如内网/自建 HTTP 源。
# 例：MEDIA_BASE_URL=http://192.168.31.10:8000
MEDIA_BASE_URL=http://192.168.31.10:8000
