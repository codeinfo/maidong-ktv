plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.local.ktv"
    compileSdk 35

    defaultConfig {
        applicationId "com.local.ktv"
        minSdk 19
        targetSdk 25
        versionCode 4
        versionName "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        // 曲库清单地址；分片按清单所在目录解析，镜像地址可指向同一份数据的其他托管位置。
        def manifestUrl = project.findProperty("DATABASE_MANIFEST_URL") ?: ""
        buildConfigField "String", "DATABASE_MANIFEST_URL", "\"${manifestUrl}\""
        def manifestMirrors = project.findProperty("DATABASE_MANIFEST_MIRRORS") ?: ""
        buildConfigField "String", "DATABASE_MANIFEST_MIRRORS", "\"${manifestMirrors}\""
        // 可选：访问需要登录的镜像（如 Gitee 大文件）时使用的访问令牌。
        def downloadToken = project.findProperty("DATABASE_TOKEN") ?: ""
        buildConfigField "String", "DATABASE_TOKEN", "\"${downloadToken}\""
        // 可选：歌曲媒体源基址（<base>/<filename>）。留空走内置签名接口；Android 4.4 上该接口
        // 返回的 https 链接不可用，指向 HTTP 镜像即可恢复下载能力。
        def mediaBaseUrl = project.findProperty("MEDIA_BASE_URL") ?: ""
        buildConfigField "String", "MEDIA_BASE_URL", "\"${mediaBaseUrl}\""

    }

    // 发布签名：从仓库根目录 keystore.properties 读取（该文件与 *.jks 均不入库）。
    // 文件缺失时不创建 release 签名配置，release 产物为未签名包，不影响 debug 构建。
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def hasReleaseSigning = keystorePropsFile.exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile", "ktv_keystore.jks"))
                storePassword keystoreProps.getProperty("storePassword", "")
                keyAlias keystoreProps.getProperty("keyAlias", "ktv")
                keyPassword keystoreProps.getProperty("keyPassword", "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".qa"
        }
    }

    // 支持 .ts 视频文件(aapt 不压缩这些文件以避免 SoundPool/MediaPlayer 问题)
    androidResources {
        noCompress 'ts', 'mp3', 'mp4', 'aac', 'm4a', 'flac', 'wav'
    }

    // 关闭发布构建的 lint vital 检查(本地分发的 APK 不需要 Google Play 上架要求)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // 启用 BuildConfig 生成,供 AboutFragment 读取版本号/版本Code等信息
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

}

// 强制统一 Kotlin 标准库版本,避免 appcompat 与其他依赖的版本冲突
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22"
    }
}

dependencies {
    implementation files('libs/original-ijk-runtime.jar')
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.zxing:core:3.5.3"
    implementation "com.liulishuo.okdownload:okdownload:1.0.7"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"

}
